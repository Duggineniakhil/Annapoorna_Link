# Render Blueprint for the Annapoorna Link API (server/).
# In Render: New + → Blueprint → pick this repository. It creates the service below.
# No database: the API runs in memory on the seeded demo data and resets on restart
# (see server/DEPLOY.md). JWT_SECRET is generated by Render, so it never lives in the repo.
services:
  - type: web
    name: annapoorna-link-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    # --include=dev: TypeScript is a dev dependency and NODE_ENV=production would skip it.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://annapoorna-link.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: USE_STUBS
        value: "true"
      # Demo deploy: demo donors' posts go to the demo kitchens first (at any hour), and any
      # signed-in user may start the wedding-night demo.
      - key: DEMO_MODE
        value: "true"
